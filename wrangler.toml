# ══════════════════════════════════════════════════════════════════
# The SITE deployment — prototype/ served as static assets.
#
# `name` must match the existing Worker, or this creates a second one
# at a different hostname. It is read from the live URL:
#   aliphcreative.ceo-6c6.workers.dev
#    └── worker name        └── account subdomain
# Check it in the dashboard before the first deploy from here.
#
# There is no `main` — this is an assets-only Worker, no script.
#
# ⚠️ NOT the chatbot. That is chat-worker/wrangler.toml, a separate
# deployable with its own name. Run wrangler from the directory whose
# config you mean: repo root deploys the site, chat-worker/ deploys
# the chat backend.
# ══════════════════════════════════════════════════════════════════

name = "aliphcreative"
compatibility_date = "2026-08-01"

# ⚠️ Pinned deliberately. Logins here can reach two accounts — the studio's
# (Ceo@aliphcreative.com's) and a personal one — and with more than one in
# reach wrangler stops and asks. Answer that prompt wrong and the site
# publishes into the personal account at a different hostname, looking like
# a successful deploy. The ID is not a secret; it appears in dashboard URLs.
# `ceo-6c6` in the live hostname is this ID's first characters.
account_id = "6c60bd775004cfa0082f768c356c7242"

[assets]
directory = "./prototype"
