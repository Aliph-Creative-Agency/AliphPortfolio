# ══════════════════════════════════════════════════════════════════
# Aliph chat Worker — plan §4. A separate deployable; `prototype/` has
# no build step and must keep it that way.
# ══════════════════════════════════════════════════════════════════

name = "aliph-chat"
main = "src/index.js"
compatibility_date = "2026-08-01"

[observability]
enabled = true

[vars]
# The widget's origin. Plan §10.5 — where the finished site is hosted
# is still open, so this is the local preview only. Add the real
# origin before launch; "*" is for a throwaway staging box, not a
# default.
ALLOWED_ORIGINS = "http://localhost:8321,http://127.0.0.1:8321"

# ⚠️ STAGE 2 ONLY. The stub keyword-matcher is the only responder that
# exists right now, so this has to be on for the Worker to answer at
# all. Stage 3 adds the Gemini key as a secret and this flips to "0" —
# after which a missing key returns 503, /api/health reports not-ok,
# and the widget falls back to its contact card instead of quietly
# serving keyword matching to a real visitor.
ALLOW_STUB = "1"

# Stage 3:  wrangler secret put GEMINI_API_KEY
# GEMINI_MODEL defaults to gemini-2.5-flash-lite; plan §4 says re-check
# the free-tier quota against Google's current docs at that point.

# ── per-visitor rate limiting (plan §5 rule 7) ────────────────────
# KV would be cheaper and wrong: eventually-consistent counters aren't
# rate limits. Without this binding the Worker falls back to a
# per-isolate Map and /api/health reports durableRateLimit: false.
[[durable_objects.bindings]]
name = "CHAT_LIMITER"
class_name = "ChatLimiter"

[[migrations]]
tag = "v1"
# SQLite-backed, which is what makes Durable Objects available without
# a paid plan.
new_sqlite_classes = ["ChatLimiter"]
